name: Update neural stats card

on:
  schedule:
    - cron: "0 */6 * * *"      # every 6 hours
  workflow_dispatch:            # lets you run it manually from the Actions tab
  push:
    paths:
      - "scripts/generate_stats_svg.py"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate stats card
        env:
          # Optional: add a repo secret STATS_TOKEN (classic PAT with read:user + repo)
          # to include private-repo contributions. Falls back to the default token.
          GH_TOKEN: ${{ secrets.STATS_TOKEN || secrets.GITHUB_TOKEN }}
        run: python scripts/generate_stats_svg.py fncreator22

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/github-stats.svg
          git diff --staged --quiet || (git commit -m "chore: update stats card" && git push)
